<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Jolie · Como funciona (reedição do 1º criativo)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
      :root { --navy: #0b1d47; --red: #e61a27; --orange: #f39a1e; --cream: #f6ece3; --white: #ffffff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Montserrat", sans-serif; font-weight: 900; color: var(--white); }
      .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; }

      #cam { position: absolute; inset: 0; transform-origin: 50% 40%; }
      .shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #cta { filter: brightness(0.32) saturate(0.8) blur(6px); }
      #shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(11,29,71,0.6) 0%, rgba(11,29,71,0) 30%, rgba(11,29,71,0) 58%, rgba(11,29,71,0.4) 84%, rgba(11,29,71,0.2) 100%); }

      .cap { position: absolute; left: 70px; right: 70px; text-align: center; font-size: 72px; line-height: 1.22; letter-spacing: -0.015em; }
      .cw { display: inline-block; color: var(--white); -webkit-text-stroke: 12px var(--navy); paint-order: stroke fill; opacity: 0; text-shadow: 0 6px 18px rgba(0,0,0,0.35); }
      .cw.k { -webkit-text-stroke: 0; padding: 0 18px 4px; border-radius: 20px; background: var(--red); text-shadow: none; box-shadow: 0 10px 0 rgba(11,29,71,0.9); }

      .hl { position: absolute; left: 66px; top: 200px; width: 948px; font-size: 100px; line-height: 1.04; letter-spacing: -0.04em; text-transform: uppercase; opacity: 0; }
      .hl .t { color: var(--white); -webkit-text-stroke: 16px var(--navy); paint-order: stroke fill; }
      .pill { display: inline-block; padding: 0 24px 6px; border-radius: 26px; color: var(--white); box-shadow: 0 12px 0 rgba(11,29,71,0.85); white-space: nowrap; }
      .pill.red { background: var(--red); }
      .pill.navy { background: var(--navy); border: 6px solid var(--white); }
      #h1 { opacity: 1; }
      #h2 { font-size: 86px; }
      .swap { position: relative; display: block; height: 1.2em; }
      .swap .pill { position: absolute; left: 0; top: 0; opacity: 0; }

      /* contador de "itens" do tour: barras finas que enchem a cada corte (mostra progresso, segura até o fim) */
      #dots { position: absolute; left: 66px; top: 470px; display: flex; gap: 12px; opacity: 0; }
      #dots i { display: flex; align-items: center; justify-content: center; width: 96px; height: 96px; border-radius: 50%; font-style: normal; font-size: 50px; color: #ffffff; background: rgba(11,29,71,0.72); border: 5px dashed rgba(255,255,255,0.85); border-radius: 6px; background: rgba(255,255,255,0.35); box-shadow: 0 4px 0 rgba(11,29,71,0.7); }
      #dots i b { position: absolute; width: 96px; height: 96px; border-radius: 50%; background: var(--red); border: 5px solid var(--white); color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 50px; transform: scale(0); }
      #dots i { position: relative; }

      #addr { position: absolute; left: 90px; right: 90px; top: 1230px; padding: 40px 34px; border-radius: 44px; background: var(--navy); border: 5px solid var(--cream); text-align: center; opacity: 0; box-shadow: 0 18px 0 rgba(0,0,0,0.3); }
      #addr-a { display: inline-flex; align-items: center; gap: 12px; padding: 12px 34px; border-radius: 22px; background: var(--red); font-size: 56px; }
      #addr-l { margin-top: 20px; font-size: 48px; font-weight: 700; color: var(--cream); }

      /* logo oficial recortado da arte do cliente (sem redesenhar) */
      #logo { position: absolute; left: 270px; top: 300px; width: 540px; height: 540px; border-radius: 60px; overflow: hidden; opacity: 0; box-shadow: 0 20px 0 rgba(11,29,71,0.6); }
      #logo div { position: absolute; left: -135px; top: -203px; width: 810px; height: 1440px; background: url("assets/img/cartao-jolie.png") 0 0 / 810px 1440px no-repeat; }

      #end { position: absolute; left: 0; right: 0; top: 980px; text-align: center; opacity: 0; }
      #end-k { font-size: 64px; color: var(--cream); letter-spacing: -0.02em; }
      #btn { position: relative; display: inline-flex; align-items: center; gap: 22px; margin-top: 26px; padding: 34px 64px; border-radius: 999px; background: var(--red); font-size: 76px; letter-spacing: -0.02em; box-shadow: 0 16px 0 #7d0b12; }
      #btn .ic { font-size: 70px; }
      #ripple { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 8px solid var(--cream); opacity: 0; }
      #hand { position: absolute; left: 790px; top: 1100px; font-size: 150px; color: var(--white); filter: drop-shadow(0 10px 0 rgba(11,29,71,0.9)); opacity: 0; }
      #hand .ic { fill: var(--white); stroke: var(--navy); stroke-width: 1.4; }
      #end-a { margin-top: 56px; font-size: 44px; font-weight: 700; color: var(--cream); }
      #end-a b { color: var(--orange); font-weight: 900; }

      #flash { position: absolute; inset: 0; background: var(--cream); opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21.508" data-width="1080" data-height="1920">
      <div id="cam">
        <video id="c1" class="shot clip" src="assets/footage/jolie.mp4" muted playsinline data-start="0.0" data-duration="2.143" data-media-start="40.78" data-track-index="0"></video>
        <video id="c2" class="shot clip" src="assets/footage/jolie.mp4" muted playsinline data-start="2.143" data-duration="1.607" data-media-start="8.0" data-track-index="1"></video>
        <video id="c3" class="shot clip" src="assets/footage/jolie.mp4" muted playsinline data-start="3.75" data-duration="2.143" data-media-start="28.55" data-track-index="0"></video>
        <video id="c4" class="shot clip" src="assets/footage/jolie.mp4" muted playsinline data-start="5.893" data-duration="2.143" data-media-start="33.0" data-track-index="1"></video>
        <video id="c5" class="shot clip" src="assets/footage/jolie.mp4" muted playsinline data-start="8.036" data-duration="2.143" data-media-start="36.25" data-track-index="0"></video>
        <video id="c6" class="shot clip" src="assets/footage/jolie.mp4" muted playsinline data-start="10.179" data-duration="2.143" data-media-start="45.35" data-track-index="1"></video>
        <video id="c7" class="shot clip" src="assets/footage/jolie.mp4" muted playsinline data-start="12.322" data-duration="2.143" data-media-start="51.6" data-track-index="0"></video>
        <video id="c8" class="shot clip" src="assets/footage/jolie.mp4" muted playsinline data-start="14.465" data-duration="2.143" data-media-start="14.9" data-track-index="1"></video>
        <img id="card" class="shot clip" src="assets/img/cartao-jolie.png" alt="" data-start="16.608" data-duration="2.0" data-track-index="0" />
        <img id="cta" class="shot clip" src="assets/img/cartao-jolie.png" alt="" data-start="18.608" data-duration="2.9" data-track-index="1" />
      </div>
      <div id="shade"></div>

      <div class="hl" id="h1"><span class="t">Você monta</span><br /><span class="pill red" id="h1-p">seu sorvete!</span></div>
      <div class="hl" id="h0"><span class="t">Como funciona</span><br /><span class="pill navy" id="h0-p">na Jolie?</span></div>
      <div class="hl" id="h2"><span class="t" id="h2-k">Passo a passo</span><span class="swap" id="swap"></span></div>
      <div id="dots"></div>
      <div class="hl" id="h3"><span class="t">Te esperamos</span><br /><span class="pill red" id="h3-p">na Jolie!</span></div>
      <div id="addr"><div id="addr-a"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" />
  <circle cx="12" cy="10" r="3" /></svg> Asa Norte</div><div id="addr-l">CLN 407, Bloco A, Lojas 1 e 5</div></div>

      

      <div id="logo"><div></div></div>
      <div id="end">
        <div id="end-k">Toque em</div>
        <div id="btn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11" /></svg><span id="btn-l">Como chegar</span><div id="ripple"></div></div>
        <div id="end-a">CLN 407, Bloco A · <b>Asa Norte</b></div>
      </div>
      <div id="hand"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 14a8 8 0 0 1-8 8" />
  <path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2" />
  <path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1" />
  <path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10" />
  <path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" /></svg></div>

      <div id="flash"></div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="21.508" data-track-index="20"></audio>
    </div>

    <script>
      const CONFIG = { cta: "Como chegar" };
      document.getElementById("btn-l").textContent = CONFIG.cta;
      const T = {"total": 21.508, "cuts": {"c1": [0.0, 2.143, [1.18, 1.04]], "c2": [2.143, 1.607, [1.04, 1.1]], "c3": [3.75, 2.143, [1.04, 1.1]], "c4": [5.893, 2.143, [1.0, 1.06]], "c5": [8.036, 2.143, [1.06, 1.12]], "c6": [10.179, 2.143, [1.04, 1.1]], "c7": [12.322, 2.143, [1.06, 1.12]], "c8": [14.465, 2.143, [1.24, 1.3]], "card": [16.608, 2.0, [1.0, 1.03]], "cta": [18.608, 2.9, [1.08, 1.1]]}, "words": [], "tags": [[3.75, 2.143, "PEGUE SEU COPO"], [5.893, 2.143, "ESCOLHA O SABOR"], [8.036, 2.143, "SIRVA-SE"], [10.179, 2.143, "COBERTURAS"], [12.322, 2.143, "AGORA É CURTIR!"]]};
      const C = T.cuts;
      // pílulas do título "Na Jolie tem ___" (uma por corte do tour) + barras de progresso
      const sw = document.getElementById("swap"), dots = document.getElementById("dots");
      T.tags.forEach((g, i) => {
        const p = document.createElement("span"); p.className = "pill " + (i % 2 ? "navy" : "red"); p.id = "tag" + i; p.textContent = g[2]; sw.appendChild(p);
        const d = document.createElement("i"); d.innerHTML = (i + 1) + '<b id="dot' + i + '">' + (i + 1) + '</b>'; dots.appendChild(d);
      });

      const tl = gsap.timeline({ paused: true });
      const ir = { immediateRender: false };

      // ---- câmera ----
      Object.entries(C).forEach(([id, [s, d, z]]) => {
        if (id === "c1") {
          tl.fromTo("#cam", { scale: z[0] }, { scale: 1.05, duration: 0.5, ease: "expo.out", ...ir }, s)
            .fromTo("#cam", { scale: 1.05 }, { scale: z[1], duration: d - 0.5, ease: "none", ...ir }, s + 0.5);
        } else {
          tl.set("#cam", { transformOrigin: id === "c8" ? "50% 0%" : "50% 40%" }, s);
          tl.fromTo("#cam", { scale: z[0] }, { scale: z[1], duration: d, ease: "none", ...ir }, s);
        }
      });
      // entrada na loja: flash creme + zoom rápido (a "virada" do vídeo)
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.6, duration: 0.05, ...ir }, C.c3[0] - 0.04)
        .to("#flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, C.c3[0] + 0.02)
        .fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.06, ...ir }, C.card[0] - 0.03)
        .to("#flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, C.card[0] + 0.03);

      // ---- legendas ----
      T.words.forEach((w) => {
        if (!document.getElementById(w.id)) return;
        tl.fromTo("#" + w.id, { opacity: 0, scale: w.k ? 0.7 : 0.88 }, { opacity: 1, scale: 1, duration: w.k ? 0.22 : 0.14, ease: w.k ? "back.out(1.6)" : "power2.out", ...ir }, w.t - 0.04);
      });

      // ---- 1 · gancho visível desde o 1º quadro (o melhor take do produto primeiro) ----
      tl.fromTo("#h1", { y: -30 }, { y: 0, duration: 0.5, ease: "expo.out", ...ir }, 0)
        .fromTo("#h1-p", { scale: 1 }, { scale: 1.12, duration: 0.12, yoyo: true, repeat: 1, ease: "power1.out", ...ir }, 0.9)
        .to("#h1", { x: -1000, duration: 0.28, ease: "power3.in" }, C.c2[0] - 0.12);
      // ---- "Como funciona na Jolie?" + os 5 passos aparecem vazios ----
      tl.fromTo("#h0", { opacity: 0, x: -1000 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", ...ir }, C.c2[0] + 0.02)
        .fromTo("#dots", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", ...ir }, C.c2[0] + 0.3)
        .to("#h0", { x: -1000, duration: 0.25, ease: "power3.in" }, C.c3[0] - 0.12);

      // ---- 2 · tour: título fixo, só a palavra troca (na batida, a cada corte) ----
      tl.fromTo("#h2", { opacity: 0, x: -1000 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", ...ir }, C.c3[0]);
      T.tags.forEach((g, i) => {
        const [s, d] = g;
        tl.fromTo("#tag" + i, { opacity: 0, y: 90, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out", ...ir }, s + 0.04);
        tl.fromTo("#dot" + i, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(1.8)", ...ir }, s + 0.04);
        const next = T.tags[i + 1];
        const outT = next ? next[0] - 0.12 : C.c8[0] - 0.12;
        tl.to("#tag" + i, { opacity: 0, y: -90, filter: "blur(12px)", duration: 0.14, ease: "power2.in" }, outT);
      });
      tl.to(["#h2", "#dots"], { x: -1000, duration: 0.3, ease: "power3.in" }, C.c8[0] - 0.12);

      // ---- 3 · fachada: "Vem pra Jolie!" + endereço ----
      tl.fromTo("#h3", { opacity: 0, x: -1000 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", ...ir }, C.c8[0] + 0.05)
        .fromTo("#h3-p", { scale: 0.6 }, { scale: 1, duration: 0.3, ease: "back.out(1.6)", ...ir }, C.c8[0] + 0.25)
        .fromTo("#addr", { opacity: 0, y: 260 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", ...ir }, C.c8[0] + 0.6)
        .to(["#h3", "#addr"], { opacity: 0, duration: 0.2 }, C.card[0] - 0.1);

      // ---- CTA: logo oficial (recortado da arte) + botão ----
      const e0 = C.cta[0];
      tl.fromTo("#logo", { opacity: 0, scale: 1.6, rotation: -10 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.32, ease: "power4.in", ...ir }, e0 + 0.05)
        .fromTo("#end", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", ...ir }, e0 + 0.3)
        .fromTo("#hand", { opacity: 0, x: 220, y: 260 }, { opacity: 1, x: 0, y: 0, duration: 0.45, ease: "power3.out", ...ir }, e0 + 0.75)
        .fromTo("#hand", { scale: 1 }, { scale: 0.86, duration: 0.09, yoyo: true, repeat: 1, ease: "power1.inOut", ...ir }, e0 + 1.3)
        .fromTo("#btn", { scale: 1 }, { scale: 0.94, duration: 0.09, yoyo: true, repeat: 1, ease: "power1.inOut", ...ir }, e0 + 1.3)
        .fromTo("#ripple", { opacity: 0.9, scale: 0.5 }, { opacity: 0, scale: 5, duration: 0.6, ease: "power2.out", ...ir }, e0 + 1.36)
        .fromTo("#btn", { scale: 1 }, { scale: 1.04, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut", ...ir }, e0 + 1.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
